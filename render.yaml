services:
  - type: web
    name: ho-so-cua-toi-web
    env: python
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DEFAULT_LOCALE
        value: vi
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: EXPORT_DIR
        value: exports
      - key: MAX_PROFILE_FIELDS
        value: "20"
      - key: SEND_FILE_MAX_AGE_DEFAULT
        value: "43200"
      - key: OWNER_NAME
        value: Doãn Trần Bảo Huy
      - key: OWNER_TELEGRAM
        value: https://t.me/baohuyno1
