<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" content="Trang lỗi 404">
<meta name="author" content="Doãn Trần Bảo Huy">
<meta name="theme-color" content="#0a0a0a">
<title>Lỗi 404</title>
<style>
/* ===== BIẾN TOÀN CỤC ===== */
:root {
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 48px;
  --space-4xl: 64px;
  --fs-xs: 10px;
  --fs-sm: 12px;
  --fs-base: 14px;
  --fs-md: 16px;
  --fw-normal: 400;
  --font-main: 'Courier New', monospace;
  --font-mono: 'Courier New', monospace;
  --text-strong: #ffffff;
  --text: #e0e0e0;
  --text-muted: rgba(255, 255, 255, 0.6);
  --text-dim: rgba(255, 255, 255, 0.3);
  --border: rgba(255, 255, 255, 0.15);
  --danger: #c94a4a;
  --radius-md: 6px;
  --radius-lg: 10px;
  --transition-base: 0.2s ease;
  --transition-fast: 0.1s ease;
}

/* ===== RESET CƠ BẢN ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a12;
  color: var(--text);
  font-family: var(--font-main);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ==========================================================================
   KHỐI THÔNG BÁO LỖI
   Khung, mã lỗi, tiêu đề, mô tả, nút, liên kết hỗ trợ và mã lỗi chi tiết
   ========================================================================== */

/* --------------------------------------------------------------------------
   KHUNG LỖI
   -------------------------------------------------------------------------- */
.error-card {
  text-align: center;
  padding: var(--space-4xl) var(--space-xl);
  position: relative;
  overflow: hidden;
  animation: error-fade-in 0.5s ease forwards;
  max-width: 480px;
  width: 100%;
}

@keyframes error-fade-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Lớp phủ ánh sáng phía trên */
.error-card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: 50%;
  transform: translateX(-50%);
  width: 200%;
  height: 100%;
  background: radial-gradient(
    ellipse at center,
    rgba(201, 74, 74, 0.12),
    transparent 70%
  );
  pointer-events: none;
  z-index: 0;
}

/* --------------------------------------------------------------------------
   MÃ LỖI
   -------------------------------------------------------------------------- */
.error-code {
  position: relative;
  z-index: 1;
  font-size: 96px;
  font-weight: var(--fw-normal);
  line-height: 1;
  letter-spacing: -4px;
  color: var(--text-strong);
  font-family: var(--font-main);
  user-select: none;
  text-shadow: 0 0 32px rgba(201, 74, 74, 0.35);
}

/* --------------------------------------------------------------------------
   TIÊU ĐỀ LỖI
   -------------------------------------------------------------------------- */
.error-title {
  position: relative;
  z-index: 1;
  margin-top: var(--space-md);
  font-size: var(--fs-base);
  letter-spacing: 6px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-family: var(--font-mono);
  user-select: none;
}

/* --------------------------------------------------------------------------
   MÔ TẢ LỖI
   -------------------------------------------------------------------------- */
.error-message {
  position: relative;
  z-index: 1;
  margin-top: var(--space-lg);
  font-size: var(--fs-md);
  color: var(--text);
  font-style: italic;
  line-height: 1.5;
  max-width: 320px;
  margin-left: auto;
  margin-right: auto;
}

/* --------------------------------------------------------------------------
   MÃ LỖI CHI TIẾT
   -------------------------------------------------------------------------- */
.error-detail {
  position: relative;
  z-index: 1;
  margin-top: var(--space-base);
  display: inline-block;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: rgba(0, 0, 0, 0.3);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  letter-spacing: 1px;
  color: var(--text-muted);
  max-width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  user-select: text;
}

.error-detail .label {
  color: var(--text-dim);
  margin-right: 6px;
  text-transform: uppercase;
}

/* --------------------------------------------------------------------------
   NHÓM NÚT
   -------------------------------------------------------------------------- */
.error-actions {
  position: relative;
  z-index: 1;
  margin-top: var(--space-2xl);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--space-md);
}

/* --------------------------------------------------------------------------
   NÚT LỖI
   -------------------------------------------------------------------------- */
.error-button {
  display: inline-block;
  padding: var(--space-md) var(--space-xl);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  text-decoration: none;
  color: var(--text);
  font-size: var(--fs-sm);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: var(--font-mono);
  cursor: pointer;
  user-select: none;
  transition: color var(--transition-base),
              border-color var(--transition-base),
              background var(--transition-base),
              transform var(--transition-fast);
}

.error-button:hover {
  color: var(--text-strong);
  border-color: var(--text-strong);
  background: rgba(255, 255, 255, 0.04);
}

.error-button:active {
  transform: scale(0.98);
}

.error-button:focus-visible {
  outline: 1px solid var(--text-strong);
  outline-offset: 2px;
}

.error-button.primary {
  border-color: var(--danger);
  color: var(--text-strong);
  background: rgba(201, 74, 74, 0.12);
}

.error-button.primary:hover {
  border-color: #ff5a8a;
  background: rgba(201, 74, 74, 0.2);
}

.error-button.ghost {
  border-color: transparent;
  color: var(--text-muted);
}

.error-button.ghost:hover {
  color: var(--text-strong);
  border-color: var(--border);
  background: transparent;
}

/* --------------------------------------------------------------------------
   LIÊN KẾT HỖ TRỢ
   -------------------------------------------------------------------------- */
.error-help {
  position: relative;
  z-index: 1;
  margin-top: var(--space-xl);
  font-size: var(--fs-sm);
  color: var(--text-muted);
  font-family: var(--font-mono);
  letter-spacing: 1px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: var(--space-md);
}

.error-help span {
  text-transform: uppercase;
  letter-spacing: 2px;
}

.error-help a {
  color: var(--text);
  text-decoration: none;
  border-bottom: 1px solid var(--border);
  padding-bottom: 2px;
  transition: color var(--transition-base),
              border-color var(--transition-base);
}

.error-help a:hover {
  color: var(--text-strong);
  border-color: var(--text-strong);
}

/* --------------------------------------------------------------------------
   MÃ LỖI THEO LOẠI
   -------------------------------------------------------------------------- */
.error-card[data-code="404"] .error-code {
  text-shadow: 0 0 32px rgba(90, 122, 154, 0.4);
}

.error-card[data-code="500"] .error-code {
  text-shadow: 0 0 32px rgba(201, 74, 74, 0.5);
}

.error-card[data-code="403"] .error-code {
  text-shadow: 0 0 32px rgba(201, 162, 39, 0.4);
}

.error-card[data-code="405"] .error-code {
  text-shadow: 0 0 32px rgba(90, 138, 255, 0.4);
}

/* --------------------------------------------------------------------------
   ĐIỀU CHỈNH MÀN HÌNH NHỎ
   -------------------------------------------------------------------------- */
@media (max-width: 480px) {
  .error-card {
    padding: var(--space-3xl) var(--space-lg);
  }

  .error-code {
    font-size: 72px;
    letter-spacing: -3px;
  }

  .error-title {
    font-size: var(--fs-sm);
    letter-spacing: 4px;
  }

  .error-message {
    font-size: var(--fs-base);
  }

  .error-detail {
    font-size: 10px;
    padding: 6px 10px;
  }

  .error-actions {
    margin-top: var(--space-xl);
  }

  .error-button {
    padding: var(--space-sm) var(--space-lg);
    font-size: var(--fs-xs);
  }

  .error-help {
    font-size: var(--fs-xs);
    gap: var(--space-sm);
  }
}

/* --------------------------------------------------------------------------
   ĐIỀU CHỈNH ĐIỆN THOẠI NHỎ
   -------------------------------------------------------------------------- */
@media (max-width: 360px) {
  .error-code {
    font-size: 56px;
    letter-spacing: -2px;
  }

  .error-title {
    font-size: 11px;
    letter-spacing: 3px;
  }

  .error-message {
    font-size: var(--fs-sm);
  }

  .error-button {
    padding: 8px 16px;
    font-size: 10px;
  }
}

/* --------------------------------------------------------------------------
   CHẾ ĐỘ TƯƠNG PHẢN CAO
   -------------------------------------------------------------------------- */
@media (prefers-contrast: high) {
  .error-card {
    border-width: 2px;
  }

  .error-code,
  .error-title,
  .error-message,
  .error-detail {
    color: #ffffff;
  }

  .error-button {
    border-color: #ffffff;
  }
}

/* --------------------------------------------------------------------------
   CHẾ ĐỘ GIẢM CHUYỂN ĐỘNG
   -------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .error-card {
    animation: none;
  }

  .error-button {
    transition: none;
  }
}

/* --------------------------------------------------------------------------
   CHẾ ĐỘ IN ẤN
   -------------------------------------------------------------------------- */
@media print {
  .error-card {
    background: #ffffff;
    border: 1px solid #cccccc;
    box-shadow: none;
  }

  .error-card::before {
    display: none;
  }

  .error-code,
  .error-title,
  .error-message,
  .error-detail {
    color: #000000;
    text-shadow: none;
  }

  .error-button,
  .error-help {
    display: none;
  }
}
</style>
</head>
<body>

<!-- Khối thông báo lỗi 404 -->
<div class="error-card" data-code="404">
  <div class="error-code">404</div>
  <div class="error-title">Không tìm thấy</div>
  <div class="error-message">Trang bạn yêu cầu không tồn tại hoặc đã bị di chuyển.</div>
  <div class="error-detail">
    <span class="label">Mã:</span> 404_NOT_FOUND
  </div>
  <div class="error-actions">
    <a href="/" class="error-button primary">Về trang chủ</a>
    <a href="/lien-he" class="error-button ghost">Liên hệ hỗ trợ</a>
  </div>
  <div class="error-help">
    <span>Hỗ trợ:</span>
    <a href="mailto:huydoan633@gmail.com">help@example.com</a>
  </div>
</div>

</body>
</html>
