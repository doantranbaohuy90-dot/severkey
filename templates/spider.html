{% extends "base.html" %}

{% block title %}Con nhện chạy trên code{% endblock %}

{% block content %}
  <!-- Khung chứa canvas con nhện -->
  <section class="card spider-card">
    <canvas id="spider-canvas"></canvas>
  </section>
{% endblock %}

{% block scripts %}
<script>
// Lấy canvas và context
const canvas = document.getElementById('spider-canvas');
const ctx = canvas.getContext('2d');

// Biến kích thước
let W, H;

// Hàm cập nhật kích thước canvas theo khung chứa
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  W = canvas.width = rect.width;
  H = canvas.height = 420;
  buildNodes();
}
window.addEventListener('resize', resize);

// Danh sách nút lệnh theo studio.prompt trong ảnh
const NODE_DATA = [
  { label: 'staff hired',   color: '#ff5a8a' },
  { label: 'source packet', color: '#ff8a5a' },
  { label: 'clear object',  color: '#ffd75a' },
  { label: 'drafts',        color: '#a8ff5a' },
  { label: 'role',          color: '#5affa8' },
  { label: 'objective',     color: '#5ad7ff' },
  { label: 'ship',          color: '#5a8aff' },
  { label: 'one',           color: '#a85aff' },
  { label: 'manual run',    color: '#ff5ad7' },
  { label: 'start',         color: '#ff5a5a' },
  { label: 'result',        color: '#ff9a5a' },
  { label: 'repeat',        color: '#ffd75a' },
  { label: 'use only',      color: '#a8ff5a' },
  { label: 'actually',      color: '#5affa8' },
  { label: 'provided',      color: '#5ad7ff' },
  { label: 'brand',         color: '#5a8aff' },
  { label: 'fact sheet',    color: '#a85aff' },
  { label: 'transcript',    color: '#ff5ad7' },
  { label: 'saved',         color: '#ff5a8a' },
  { label: 'feedback',      color: '#ff8a5a' },
  { label: 'next',          color: '#ffd75a' },
  { label: 'approve',       color: '#a8ff5a' },
  { label: 'publishing',    color: '#5affa8' },
  { label: 'external',      color: '#5ad7ff' },
  { label: 'context',       color: '#5a8aff' },
  { label: 'researcher',    color: '#a85aff' },
  { label: 'writer',        color: '#ff5ad7' },
  { label: 'producer',      color: '#ff5a8a' },
  { label: 'editor',        color: '#ff8a5a' },
  { label: 'publisher',     color: '#ffd75a' }
];

let nodes = [];

// Hàm tính vị trí các node theo bố cục lưới
function buildNodes() {
  nodes = [];
  const paddingX = 100;
  const paddingY = 55;
  const cols = Math.max(2, Math.floor(W / paddingX));
  const offsetX = (W - (cols - 1) * paddingX) / 2;
  const offsetY = 50;

  NODE_DATA.forEach((item, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    nodes.push({
      ...item,
      x: offsetX + col * paddingX,
      y: offsetY + row * paddingY,
      radius: 22,
    });
  });
}

// Lớp con nhện chạy theo danh sách node
class Spider {
  constructor() {
    this.nodeIndex = 0;
    this.x = 0;
    this.y = 0;
    this.vx = 0;
    this.vy = 0;
    this.legPhase = 0;
    this.size = 1.8;
    this.color = '#c060ff';
    this.speed = 0.15;
    this.maxSpeed = 5;
    this.waitTimer = 0;
  }

  reset() {
    if (nodes.length === 0) return;
    this.nodeIndex = 0;
    this.x = nodes[0].x;
    this.y = nodes[0].y;
    this.vx = 0;
    this.vy = 0;
  }

  update() {
    if (this.waitTimer > 0) {
      this.waitTimer--;
      this.legPhase += 0.15;
      return;
    }
    if (nodes.length === 0) return;
    const target = nodes[this.nodeIndex];
    const dx = target.x - this.x;
    const dy = target.y - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 5) {
      this.x = target.x;
      this.y = target.y;
      this.vx = 0;
      this.vy = 0;
      this.waitTimer = 20;
      this.nodeIndex = (this.nodeIndex + 1) % nodes.length;
      return;
    }

    this.vx += (dx / dist) * this.speed;
    this.vy += (dy / dist) * this.speed;

    const sp = Math.hypot(this.vx, this.vy);
    if (sp > this.maxSpeed) {
      this.vx = (this.vx / sp) * this.maxSpeed;
      this.vy = (this.vy / sp) * this.maxSpeed;
    }

    this.vx *= 0.96;
    this.vy *= 0.96;
    this.x += this.vx;
    this.y += this.vy;
    this.legPhase += 0.4 + sp * 0.1;
  }

  draw(ctx) {
    const s = this.size;
    ctx.save();
    ctx.translate(this.x, this.y);

    const angle = Math.atan2(this.vy, this.vx);
    ctx.rotate(angle + Math.PI / 2);

    ctx.strokeStyle = this.color;
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const side = i < 4 ? -1 : 1;
      const idx = i % 4;
      const baseAngle = -Math.PI / 2 + side * (0.5 + idx * 0.45);
      const swing = Math.sin(this.legPhase + i) * 0.35;
      const len1 = 7 * s;
      const len2 = 9 * s;

      const a1 = baseAngle + swing;
      const x1 = Math.cos(a1) * len1;
      const y1 = Math.sin(a1) * len1;

      const a2 = a1 + side * 0.6;
      const x2 = x1 + Math.cos(a2) * len2;
      const y2 = y1 + Math.sin(a2) * len2;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.ellipse(0, 2 * s, 3.5 * s, 4.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0, -3.5 * s, 2.5 * s, 2.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-1 * s, -4 * s, 0.7 * s, 0, Math.PI * 2);
    ctx.arc(1 * s, -4 * s, 0.7 * s, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

const spider = new Spider();
resize();
spider.reset();

function loop() {
  ctx.fillStyle = 'rgba(10, 10, 18, 0.3)';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const isTarget = i === spider.nodeIndex;

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
    ctx.fillStyle = isTarget
      ? 'rgba(192, 96, 255, 0.15)'
      : 'rgba(255, 255, 255, 0.03)';
    ctx.fill();

    ctx.strokeStyle = isTarget ? n.color : 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = isTarget ? 2 : 1;
    ctx.stroke();

    ctx.fillStyle = isTarget ? '#fff' : 'rgba(255, 255, 255, 0.6)';
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, n.x, n.y);
  }

  spider.update();
  spider.draw(ctx);
  requestAnimationFrame(loop);
}
loop();
</script>
{% endblock %}
